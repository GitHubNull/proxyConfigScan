name: android-build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 依赖与代码生成
        run: flutter pub get

      - name: 单测
        run: flutter test

      - name: 构建 split-per-abi APK
        run: flutter build apk --split-per-abi --release

      - uses: actions/upload-artifact@v4
        with:
          name: proxyscan-apk-${{ github.sha }}
          path: src/mobile/build/app/outputs/flutter-apk/*.apk
          retention-days: 14
