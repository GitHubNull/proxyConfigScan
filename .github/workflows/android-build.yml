name: android-build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: src/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 依赖与代码生成
        run: flutter pub get

      - name: 单测
        run: flutter test

      - name: 构建 split-per-abi APK
        run: flutter build apk --split-per-abi --release

      - uses: actions/upload-artifact@v4
        with:
          name: proxyscan-apk-${{ github.sha }}
          path: src/mobile/build/app/outputs/flutter-apk/*.apk
          retention-days: 14

      # upload-artifact 只进 Actions 运行页（14 天），Release Assets 需显式上传
      - name: 发布 APK 到 Release Assets（tag 推送时）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_notes: true
          files: src/mobile/build/app/outputs/flutter-apk/*.apk
