name: ios-build

# macOS runner 计时 ×10 倍率：限定 main 推送 + 手动触发（计划 M5 风险预埋）
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: src/mobile
    steps:
      - uses: actions/checkout@v4

      - name: 构建 hev-socks5-tunnel xcframework（iOS TCP 栈，见 doc/vpn-forwarding-design.md §9）
        run: |
          git clone --recursive --depth 1 https://github.com/heiher/hev-socks5-tunnel /tmp/hev
          cd /tmp/hev
          ./build-apple.sh
          HEV_XC=$(find . -maxdepth 2 -name "HevSocks5Tunnel.xcframework" | head -1)
          mkdir -p "$GITHUB_WORKSPACE/src/mobile/ios/Frameworks"
          cp -R "$HEV_XC" "$GITHUB_WORKSPACE/src/mobile/ios/Frameworks/"

      - name: 安装 xcodeproj gem（注入 pbxproj 用）
        run: sudo gem install xcodeproj --no-document

      - name: 接入 PacketTunnel extension target（script/ios-setup-packet-tunnel.rb）
        run: ruby "$GITHUB_WORKSPACE/script/ios-setup-packet-tunnel.rb"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 依赖与 CocoaPods
        run: |
          flutter pub get
          pod repo update || true

      - name: 构建 unsigned iOS 产物（无签名，仅编译验证）
        run: |
          if flutter build ios --release --no-codesign -v > /tmp/build.log 2>&1; then
            exit 0
          fi
          echo "===== flutter 构建失败，重放 xcodebuild 抓冲突双方 ====="
          CMD=$(grep -m1 "/usr/bin/xcodebuild\| xcodebuild " /tmp/build.log | sed 's/^.*xcodebuild/xcodebuild/')
          echo "$CMD"
          cd ios && eval "$CMD" 2>&1 | grep -B2 -A30 "Multiple commands produce\|error:" | head -120
          exit 1

      - name: 打包 unsigned IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -qr proxyscan-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: proxyscan-ios-unsigned-${{ github.sha }}
          path: src/mobile/build/ios/iphoneos/proxyscan-unsigned.ipa
          retention-days: 14
